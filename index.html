<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Office Diorama</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&display=swap">
<style>
[hidden] { display: none !important; }
:root { --bg: #151618; --ink: #ECEAE6; --muted: #A19E98; --panel: rgba(26,27,30,.78); --line: rgba(255,255,255,.11); --accent: #E58A3A;
  --ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); overflow: hidden; margin: 0; }
#app { position: fixed; inset: 0; }
.bar { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap;
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px); padding-bottom: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; z-index: 2; }
.tag, .ctl > * { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(10px); }
.tag { padding: 8px 12px; min-width: 0; }
.tag h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .01em; }
.tag p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.ctl { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; pointer-events: none; }
.seg { display: flex; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 10px; }
.seg button[aria-pressed="true"] { background: rgba(229,138,58,.18); color: #FFD2A8; }
button { font: 600 13px var(--ui); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#mood[aria-pressed="true"] { background: #1F2540; border-color: #5C6BC0; }
#load { position: fixed; inset: 0; pointer-events: none; display: grid; place-items: center; z-index: 5; background: var(--bg); transition: opacity .5s; }
#load .box { width: min(280px, 70vw); text-align: center; font-size: 13px; color: var(--muted); }
#load .track { height: 3px; background: var(--line); border-radius: 3px; margin-top: 10px; overflow: hidden; }
#load .fill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
@media (max-width: 640px) { .tag p { display: none; } .seg button { padding: 6px 8px; } }
@media (prefers-reduced-motion: reduce) { #load, #load .fill { transition: none; } }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="app"></div>
<header class="bar">
  <div class="tag"><h1>Office Diorama</h1><p id="hint">Drag to orbit · scroll or pinch to zoom · right-drag to pan</p></div>
  <nav class="ctl" aria-label="View controls">
    <div class="seg" id="zones" role="group" aria-label="Go to area"></div>
    <div class="seg" id="views" role="group" aria-label="Camera">
      <button type="button" data-view="iso" aria-pressed="true">Isometric</button>
      <button type="button" data-view="persp" aria-pressed="false">55 mm</button>
    </div>
    <button id="mood" type="button" aria-pressed="false">Night</button>
    <button id="reset" type="button">Reset view</button>
  </nav>
</header>
<div id="load"><div class="box"><span id="msg">Loading office model…</span><div class="track"><div class="fill" id="fill"></div></div></div></div>

<script type="module">
import { mountOffice } from './office-scene.js';
const GLB = './office.glb', PARAMS = './scene.json';
const $ = id => document.getElementById(id);
const fill = $('fill');
try {
  const view = await mountOffice($('app'), {
    glb: GLB, params: PARAMS, controls: true,
    pixelRatio: Math.min(window.devicePixelRatio, 1.5),
    onProgress: p => { fill.style.width = Math.round(p * 100) + '%'; },
  });
  const press = (group, el) => group.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === el));
  // areas
  const seg = $('zones');
  view.zones.forEach((z, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = z; b.setAttribute('aria-pressed', i === 0);
    b.onclick = () => { press(seg, b); view.focusZone(z); };
    seg.appendChild(b);
  });
  // camera: isometric <-> 55 mm
  const views = $('views');
  views.querySelectorAll('button').forEach(b => b.onclick = () => { press(views, b); view.setView(b.dataset.view); });
  $('mood').onclick = e => { const on = !view.night; view.setNight(on); e.currentTarget.setAttribute('aria-pressed', on); e.currentTarget.textContent = on ? 'Day' : 'Night'; };
  $('reset').onclick = () => { view.resetView(true); press(seg, seg.querySelector('button')); };
  window.officeView = view;
  const l = $('load'); l.style.opacity = 0; setTimeout(() => (l.hidden = true), 600);
} catch (e) {
  $('msg').textContent = 'The 3D view could not start: ' + (e && e.message ? e.message : e) + '. Try a desktop browser with WebGL enabled.';
}

</script>
</body>
</html>
